# Text Expander Configuration
# Functional Programming Version

# Expansion settings
expansions:
  file: "roms_expansions.txt"

# Timing configuration
timing:
  inactivity_timeout: 2.0      # seconds before clearing buffer
  file_check_interval: 1.0     # seconds between file checks
  backspace_delay: 0.01        # delay between backspace operations
  debounce_delay: 0.05         # minimum time between processing events

# Buffer settings
buffer:
  max_size: 100               # maximum characters to track

# Logging configuration
logging:
  level: "DEBUG"              # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Performance settings
performance:
  max_retries: 3              # maximum retry attempts for file operations
  retry_delay: 0.5            # seconds between retry attempts

# Environment overrides (these can be set via environment variables)
# TEXPANDER_LOG_LEVEL, TEXPANDER_BUFFER_SIZE, etc.
environment:
  log_level_var: "TEXPANDER_LOG_LEVEL"
  buffer_size_var: "TEXPANDER_BUFFER_SIZE"
  timeout_var: "TEXPANDER_TIMEOUT"